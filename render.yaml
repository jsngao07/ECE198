# Render configuration for the ECE198 Motion classroom demonstration.
# Adopts the existing free web service; references the existing PostgreSQL instance.
services:
  - type: web
    name: ece198-motion-demo
    runtime: python
    plan: free
    region: oregon
    repo: https://github.com/milinkaa/ECE198
    branch: render-demo
    buildCommand: cd 'Web & Database' && pip install -r requirements.txt
    startCommand: cd 'Web & Database' && gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ece198-motion-demo-db
          property: connectionString
