{% extends 'base.html' %}{% block title %}Exercise · Motion{% endblock %}{% block content %}<a class="back" href="{{ url_for('exercises') }}">← Exercises</a><h1>{{ 'Edit exercise' if exercise else 'Add exercise' }}</h1><form class="form-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="name" required value="{{ exercise.name if exercise else '' }}"></label><label>Category<input name="category" required value="{{ exercise.category if exercise else '' }}" placeholder="Strength, Mobility, Cardio..."></label><label>Description<textarea name="description" rows="4">{{ exercise.description if exercise else '' }}</textarea></label><button class="primary">Save exercise</button></form>{% endblock %}
