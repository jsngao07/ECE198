{% extends 'base.html' %}{% block title %}Patient registration · Motion{% endblock %}{% block content %}<section class="auth-card"><a class="brand" href="/">motion<span>.</span></a><h1>Create patient account</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="name" required></label><label>User ID<input name="user_id" required minlength="1" maxlength="10" pattern="[A-Za-z][A-Za-z0-9]{0,9}" title="1–10 letters or numbers; must start with a letter"></label><label>Email<input type="email" name="email"></label><label>Password<input type="password" name="password" minlength="6" maxlength="6" required></label><label>Instructor<select name="instructor_id" required><option value="">Select instructor</option>{% for i in instructors %}<option value="{{ i.id }}">{{ i.name }}</option>{% endfor %}</select></label><button class="primary full">Submit registration</button></form><p class="muted">Your instructor must approve your account before you can log in.</p><a href="{{ url_for('login') }}">Back to log in</a></section>{% endblock %}
