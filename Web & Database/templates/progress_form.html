{% extends 'base.html' %}{% block title %}Log progress · Motion{% endblock %}{% block content %}<a class="back" href="{{ url_for('dashboard') }}">← Overview</a><h1>Log {{ plan.exercise.name }}</h1><p class="muted">Target: {{ plan.sets }} sets × {{ plan.reps }} reps{% if plan.duration_minutes %} · {{ plan.duration_minutes }} min{% endif %}</p><form class="form-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="two-col"><label>Sets completed<input type="number" name="sets" min="1" value="{{ plan.sets }}" required></label><label>Reps completed<input type="number" name="reps" min="1" value="{{ plan.reps }}" required></label></div><label>Duration (minutes)<input type="number" name="duration" min="1"></label><label>Notes<textarea name="notes" rows="3"></textarea></label><button class="primary">Save progress</button></form>{% endblock %}
