{% extends 'base.html' %}{% block title %}Assign exercise · Motion{% endblock %}{% block content %}<a class="back" href="{{ url_for('patient_detail',pid=patient.id) }}">← {{ patient.name }}</a><h1>Assign exercise</h1><form class="form-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Exercise<select name="exercise_id" required>{% for e in exercises %}<option value="{{ e.id }}">{{ e.category }} · {{ e.name }}</option>{% endfor %}</select></label><div class="two-col"><label>Sets<input type="number" name="sets" min="1" value="3" required></label><label>Reps<input type="number" name="reps" min="1" value="10" required></label></div><div class="two-col"><label>Duration (minutes)<input type="number" name="duration" min="1"></label><label>Frequency per week<input type="number" name="frequency" min="1" max="7" value="3" required></label></div><label>Instructions<textarea name="instructions" rows="3"></textarea></label><button class="primary">Assign plan</button></form>{% endblock %}
