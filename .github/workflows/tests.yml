# Runs the Flask test suite on every push and pull request to render-demo.
# Render (with autoDeployTrigger: checksPass) only deploys if this passes.
name: Tests

on:
  push:
    branches: [render-demo]
  pull_request:
    branches: [render-demo]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Web & Database"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "Web & Database/requirements*.txt"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest
