# Runs Flask and browser bridge tests on main and render-demo.
# Render (with autoDeployTrigger: checksPass) only deploys if this passes.
name: Tests

on:
  push:
    branches: [main, render-demo]
  pull_request:
    branches: [main, render-demo]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Web & Database"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "Web & Database/requirements*.txt"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test USB Serial bridge
        run: node --test tests/arduino-sync.test.cjs
